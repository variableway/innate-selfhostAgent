[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
]

# Shared dependency versions for the playground's Tauri app.
# The src-tauri/Cargo.toml inherits these via `{ workspace = true }`.
# Versions are pinned to match the JS-side @tauri-apps/* packages (^2.10.x).
[workspace.dependencies]
tauri         = { version = "2.10", features = [] }
tauri-build   = { version = "2.0",  features = [] }
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"
log           = "0.4"

[workspace.package]
edition    = "2021"
rust-version = "1.77.2"
